server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any unmatched client route.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend service on the Compose network.
    location /decks {
        proxy_pass http://backend:8080;
    }
    location /quiz {
        proxy_pass http://backend:8080;
    }
}
