# FlashLearn — full stack: pgvector database, Spring Boot backend, React frontend.
# Usage:
#   docker compose up --build
#   (optional AI) GENERATION_PROVIDER=openai OPENAI_API_KEY=sk-... docker compose up --build

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flashlearn
      POSTGRES_PASSWORD: flashlearn
      POSTGRES_DB: flashlearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashlearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flashlearn
      SPRING_DATASOURCE_USERNAME: flashlearn
      SPRING_DATASOURCE_PASSWORD: flashlearn
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
    # Wait until the database reports healthy before starting.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
