spring.application.name=backend

# Datasource — values come from env vars, falling back to local-dev defaults.
# Never commit real credentials; these defaults match the local Docker Postgres only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flashlearn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flashlearn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:flashlearn}

# Flyway owns the schema; Hibernate only validates that entities match it (never alters it).
spring.jpa.hibernate.ddl-auto=validate

# Disable Open Session In View — an anti-pattern that hides lazy-loading in the web layer.
spring.jpa.open-in-view=false

# Generation provider: 'stub' (default, no key needed) or 'openai' (real Spring AI).
flashlearn.generation.provider=${GENERATION_PROVIDER:stub}

# Spring AI / OpenAI — only exercised when the provider is 'openai'.
# A non-blank fallback keeps startup healthy in stub mode; real calls need a valid key.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3

# pgvector store — Flyway owns the schema (see V2 migration), so Spring AI must not create it.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
